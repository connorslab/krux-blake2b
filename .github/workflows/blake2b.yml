name: BLAKE2b signing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned signing and QR dependencies
        run: |
          git submodule update --init --depth 1 vendor/embit firmware/MaixPy
          git -C firmware/MaixPy submodule update --init --depth 1 components/micropython/port/src/bc-ur
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e vendor/embit ./firmware/MaixPy/components/micropython/port/src/bc-ur pytest pytest-mock pycryptodome pyqrcode
      - name: Unified digest, negotiation, and fork policy
        run: python -m pytest -q fork_tests vendor/embit/tests/tests/test_unified_sighash.py vendor/embit/tests/tests/test_unified_sighash_negotiation.py
      - name: Krux regression suite
        run: python -m pytest -q tests --tb=short > test-results.txt 2>&1
      - name: Knots acceptance, mining and replay controls
        run: |
          curl --fail --location --output knots.tar.gz https://github.com/bitcoinknots/bitcoin/releases/download/v29.4.2.knots20260508/bitcoin-29.4.2.knots20260508-x86_64-linux-gnu.tar.gz
          echo 'b59d0445a317e21a03dc29425db3aba79b27d5125230b1a2b1dce62e120827c5  knots.tar.gz' | sha256sum --check
          tar -xzf knots.tar.gz
          PYTHONPATH=src python fork_tests/regtest.py "$PWD/bitcoin-29.4.2.knots20260508/bin/bitcoind" | tee node-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.txt
            node-results.txt
