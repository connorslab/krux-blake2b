name: BLAKE2b signing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned signing and QR dependencies
        run: |
          git submodule update --init --depth 1 vendor/embit firmware/MaixPy
          git -C firmware/MaixPy submodule update --init --depth 1 components/micropython/port/src/bc-ur
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e vendor/embit ./firmware/MaixPy/components/micropython/port/src/bc-ur pytest pytest-mock pycryptodome pyqrcode
      - name: Unified digest, negotiation, and fork policy
        run: python -m pytest -q fork_tests vendor/embit/tests/tests/test_unified_sighash.py vendor/embit/tests/tests/test_unified_sighash_negotiation.py
      - name: Krux regression suite
        run: python -m pytest -q tests --tb=short > test-results.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt
